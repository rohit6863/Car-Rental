<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WanderWheels | Admin Panel</title>
  <link rel="icon" type="image/jpeg" href="/img/logo.JPG" />
  <script>
    (function () {
      try {
        var saved = window.localStorage.getItem('ww_admin_theme');
        if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[#F4F7FE] dark:bg-[#0C0C0E] text-slate-900 dark:text-zinc-100 antialiased selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:bg-amber-500/20 dark:selection:text-amber-400 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
