name: CI Pipeline

on:
  push:
    branches: [main, cleanup]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wanderwheels_jest_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix carrental-api ci
          npm --prefix carrental-web ci
          npm --prefix carrental-admin ci

      - name: Run ESLint
        run: npm run lint

      - name: Initialize Test Database
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: wanderwheels_jest_test
          TEST_DB_NAME: wanderwheels_jest_test
        run: npm run db:setup

      - name: Run API Jest Test Suite
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: wanderwheels_jest_test
          TEST_DB_NAME: wanderwheels_jest_test
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_32bytes_long_value!
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32bytes_long_value!
          CSRF_SECRET: ci_test_csrf_secret_32bytes_long_value!
          PAYMENT_GATEWAY: mock
          MOCK_GATEWAY_SECRET: ci_test_mock_gateway_secret_32bytes_long!
        run: npm test

      - name: Build Web & Admin Frontends
        run: npm run build
